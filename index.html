<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marginalia – Log in or create an account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f2f4f0;--ink:#13201f;--muted:#566563;--teal:#0f4c4a;--teal-d:#0a3836;--mint:#dcebe5;--line:#c9d3cf;--err:#b3261e;--ok:#1b6b45;--card:#fff}
*{box-sizing:border-box;margin:0}
body{font-family:"Instrument Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;line-height:1.5}
.shell{display:grid;grid-template-columns:1fr 440px;gap:64px;align-items:center;max-width:1000px;width:100%}
.intro h1{font-family:Fraunces,Georgia,serif;font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.08;letter-spacing:-.01em;max-width:12ch}
.intro p{margin-top:20px;color:var(--muted);max-width:38ch;font-size:1.05rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
.tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--mint);border-radius:10px;padding:4px;margin-bottom:24px}
.tabs button{position:relative;z-index:1;background:none;border:0;padding:10px;font:600 .95rem inherit;font-family:inherit;color:var(--teal);cursor:pointer;border-radius:8px}
.tabs button[aria-selected=true]{color:#fff}
.indicator{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--teal);border-radius:8px;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.tabs[data-tab=register] .indicator{transform:translateX(100%)}
 [hidden]{display:none!important}
.field{margin-bottom:16px}
label{display:block;font-weight:500;font-size:.9rem;margin-bottom:6px}
.control{position:relative}
input[type=text],input[type=email],input[type=password]{width:100%;padding:11px 12px;font:inherit;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus-visible,button:focus-visible{outline:3px solid #7fb8b0;outline-offset:2px}
input[aria-invalid=true]{border-color:var(--err);background:#fff6f5}
input[data-valid=true]{border-color:var(--ok)}
.control input[type=password],.control input.pw{padding-right:68px}
.reveal{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--teal);font:600 .85rem inherit;font-family:inherit;padding:6px 8px;cursor:pointer;border-radius:6px}
.err{color:var(--err);font-size:.85rem;min-height:1.2em;margin-top:4px}
.hint{color:var(--muted);font-size:.82rem;margin-top:4px}
.row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 20px;font-size:.9rem}
.row label{display:flex;gap:8px;align-items:center;margin:0;font-weight:400}
.row a{color:var(--teal)}
.submit{width:100%;padding:12px;border:0;border-radius:8px;background:var(--teal);color:#fff;font:600 1rem inherit;font-family:inherit;cursor:pointer;transition:background .2s,transform .1s}
.submit:hover{background:var(--teal-d)}
.submit:active{transform:scale(.98)}
.done{text-align:center;padding:24px 0}
.done h2{font-family:Fraunces,Georgia,serif;font-size:1.6rem;margin-bottom:8px}
.done p{color:var(--muted)}
.done button{margin-top:20px;background:none;border:0;color:var(--teal);font:600 .95rem inherit;font-family:inherit;text-decoration:underline;cursor:pointer}
@media(max-width:860px){.shell{grid-template-columns:1fr;gap:32px;max-width:440px}.intro h1{max-width:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="shell">
  <section class="intro">
    <h1>Pick up where your notes left off.</h1>
    <p>Marginalia keeps your notes, sources and drafts in one place. Log in, or create an account in under a minute.</p>
  </section>

  <section class="card" aria-label="Account">
    <div class="tabs" id="tabs" data-tab="login" role="tablist" aria-label="Account options">
      <span class="indicator" aria-hidden="true"></span>
      <button role="tab" id="tab-login" aria-selected="true" aria-controls="login" type="button">Log in</button>
      <button role="tab" id="tab-register" aria-selected="false" aria-controls="register" tabindex="-1" type="button">Register</button>
    </div>

    <form id="login" role="tabpanel" aria-labelledby="tab-login" novalidate>
      <div class="field">
        <label for="l-email">Email</label>
        <input type="email" id="l-email" name="email" autocomplete="email" required>
        <p class="err" id="l-email-err" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="l-pass">Password</label>
        <div class="control">
          <input type="password" id="l-pass" name="password" autocomplete="current-password" required>
          <button type="button" class="reveal" aria-controls="l-pass" aria-pressed="false">Show</button>
        </div>
        <p class="err" id="l-pass-err" aria-live="polite"></p>
      </div>
      <div class="row">
        <label><input type="checkbox" name="remember"> Keep me logged in</label>
        <a href="#" id="forgot">Forgot password?</a>
      </div>
      <button class="submit" type="submit">Log in</button>
    </form>

    <form id="register" role="tabpanel" aria-labelledby="tab-register" novalidate hidden>
      <div class="field">
        <label for="r-name">Full name</label>
        <input type="text" id="r-name" name="name" autocomplete="name" required>
        <p class="err" id="r-name-err" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="r-email">Email</label>
        <input type="email" id="r-email" name="email" autocomplete="email" required>
        <p class="err" id="r-email-err" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="r-pass">Password</label>
        <div class="control">
          <input type="password" id="r-pass" name="password" autocomplete="new-password" aria-describedby="r-pass-hint r-pass-err" required>
          <button type="button" class="reveal" aria-controls="r-pass" aria-pressed="false">Show</button>
        </div>
        <p class="hint" id="r-pass-hint">At least 8 characters, with a letter and a number.</p>
        <p class="err" id="r-pass-err" aria-live="polite"></p>
      </div>
      <div class="field">
        <label for="r-confirm">Confirm password</label>
        <div class="control">
          <input type="password" id="r-confirm" name="confirm" autocomplete="new-password" required>
          <button type="button" class="reveal" aria-controls="r-confirm" aria-pressed="false">Show</button>
        </div>
        <p class="err" id="r-confirm-err" aria-live="polite"></p>
      </div>
      <button class="submit" type="submit">Create account</button>
    </form>

    <div class="done" id="done" role="status" aria-live="polite" hidden></div>
  </section>
</main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

// Validation rules: each returns an error message, or "" when valid.
const rules = {
  "r-name": v => v.trim().length < 2 ? "Enter your full name." : "",
  "l-email": v => emailCheck(v),
  "r-email": v => emailCheck(v),
  "l-pass": v => v ? "" : "Enter your password.",
  "r-pass": v => v.length < 8 ? "Use at least 8 characters."
    : !/[A-Za-z]/.test(v) || !/\d/.test(v) ? "Include at least one letter and one number." : "",
  "r-confirm": v => !v ? "Re-enter your password."
    : v !== $("#r-pass").value ? "Passwords don't match." : ""
};
function emailCheck(v) {
  if (!v.trim()) return "Enter your email address.";
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) ? "" : "Enter a valid email, like name@example.com.";
}

function validate(input) {
  const msg = rules[input.id](input.value);
  const err = $("#" + input.id + "-err");
  err.textContent = msg;
  input.setAttribute("aria-invalid", msg ? "true" : "false");
  input.dataset.valid = !msg && input.value ? "true" : "false";
  const ids = [input.id + "-err"];
  if (input.id === "r-pass") ids.unshift("r-pass-hint");
  input.setAttribute("aria-describedby", ids.join(" "));
  return !msg;
}

// Live validation: starts after the first blur, then updates on every keystroke.
$$("input[id]").forEach(input => {
  if (!rules[input.id]) return;
  let touched = false;
  input.addEventListener("blur", () => { if (input.value || touched) { touched = true; validate(input); } });
  input.addEventListener("input", () => {
    if (touched) validate(input);
    if (input.id === "r-pass" && $("#r-confirm").value) validate($("#r-confirm"));
  });
});

// Show / hide password
$$(".reveal").forEach(btn => btn.addEventListener("click", () => {
  const input = $("#" + btn.getAttribute("aria-controls"));
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  btn.textContent = show ? "Hide" : "Show";
  btn.setAttribute("aria-pressed", show);
}));

// Tabs
const tabs = $("#tabs"), tabBtns = $$("[role=tab]");
function switchTab(name, focus) {
  tabs.dataset.tab = name;
  tabBtns.forEach(b => {
    const on = b.id === "tab-" + name;
    b.setAttribute("aria-selected", on);
    b.tabIndex = on ? 0 : -1;
    if (on && focus) b.focus();
  });
  $("#login").hidden = name !== "login";
  $("#register").hidden = name !== "register";
  $("#done").hidden = true;
}
tabBtns.forEach(b => b.addEventListener("click", () => switchTab(b.id.replace("tab-", ""))));
tabs.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
    switchTab(tabs.dataset.tab === "login" ? "register" : "login", true);
  }
});

// Submit: validate every field, focus the first invalid one.
$$("form").forEach(form => form.addEventListener("submit", e => {
  e.preventDefault();
  const inputs = $$("input[id]", form).filter(i => rules[i.id]);
  const bad = inputs.filter(i => !validate(i));
  if (bad.length) { bad[0].focus(); return; }
  const isReg = form.id === "register";
  const name = isReg ? $("#r-name").value.trim().split(" ")[0] : "";
  form.hidden = true;
  tabs.hidden = true;
  const done = $("#done");
  done.hidden = false;
  done.innerHTML = `<h2>${isReg ? "Welcome, " + name.replace(/[<>&]/g, "") + "." : "You're logged in."}</h2>
    <p>${isReg ? "Your account has been created." : "Good to see you again."} This is a front-end demo, so nothing was sent anywhere.</p>
    <button type="button" id="back">Start over</button>`;
  $("#back").addEventListener("click", () => {
    form.reset();
    $$("input", form).forEach(i => { i.removeAttribute("aria-invalid"); i.dataset.valid = "false"; });
    tabs.hidden = false;
    switchTab(isReg ? "register" : "login", true);
  });
}));

$("#forgot").addEventListener("click", e => e.preventDefault());
</script>
</body>
</html>
